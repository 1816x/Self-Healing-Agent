name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # This repo deliberately manufactures broken code: scripts/inject_bug.sh
  # commits a catalogued bug, and --push publishes it to demo/<bug>-<sha> so a
  # fix PR has a base that actually contains the bug. Those branches must never
  # reach main — and GitHub's "Compare & pull request" banner cheerfully offers
  # exactly that for any branch you just pushed. One such PR was opened by
  # accident, which is why this job exists: the policy was documented in three
  # places and enforced in none.
  guard:
    name: no injected bug reaches main
    # Scoped to what can actually land on main. Deliberately not run on pushes
    # to demo/* branches, where the bug is present on purpose and a red build
    # would be noise rather than signal.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refuse a demo/* branch targeting main
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'demo/')
        run: |
          echo "::error::${{ github.head_ref }} carries a deliberately injected bug."
          echo "Bug branches exist only as the base for a fix PR. Retarget this PR,"
          echo "or close it — main must never carry an injected bug."
          exit 1

      # The branch-name check above only catches the naming convention. This one
      # catches the bug itself, whatever branch it arrives on. A bug patch that
      # applies cleanly *in reverse* means its "after" state is already in the
      # tree — i.e. the bug is present. On a pull_request, actions/checkout gives
      # the merge result, so this tests what main would actually become.
      - name: refuse a tree containing a catalogued bug
        run: |
          status=0
          for patch in scripts/bugs/*.patch; do
            if git apply --reverse --check "$patch" 2>/dev/null; then
              echo "::error::$patch reverse-applies cleanly — that injected bug is present here."
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "no catalogued bug present in this tree"
          fi
          exit $status

  go:
    name: monitor (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go version is go.mod — the
          # sqlite driver's requirement bumped it once already, and a
          # hardcoded copy here would have silently drifted.
          go-version-file: monitor/go.mod
          cache-dependency-path: monitor/go.sum
      - name: build
        working-directory: monitor
        run: go build ./...
      - name: vet
        working-directory: monitor
        run: go vet ./...
      - name: test
        working-directory: monitor
        run: go test ./...

  python:
    name: demo-app (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        working-directory: demo-app
        run: pip install -e ".[dev]"
      - name: lint
        working-directory: demo-app
        run: ruff check app tests
      - name: test
        working-directory: demo-app
        run: pytest -q

  agent:
    name: agent (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The agent's store tests build the monitor and let it create a real
      # database, so the cross-language schema contract is actually tested.
      # That needs the Go toolchain in this job too — without it those tests
      # skip, and a schema drift would ship green.
      - uses: actions/setup-go@v5
        with:
          go-version-file: monitor/go.mod
          cache-dependency-path: monitor/go.sum
      - name: install
        working-directory: agent
        run: pip install -e ".[dev]"
      - name: lint
        working-directory: agent
        run: ruff check diagnose tests
      - name: test
        working-directory: agent
        run: pytest -q

  # TypeScript job (dashboard) added in Phase 5, once the Next.js app exists —
  # see PLAN.md and docs/design-decisions.md for why it isn't here yet.
