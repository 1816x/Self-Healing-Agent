[project]
name = "demo-app"
version = "0.0.0"
description = "Demo orders service with structured logs and Prometheus metrics, for the self-healing agent to monitor."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    # Bounded for the same reason as agent/pyproject.toml: an open-ended
    # ruff means CI and a developer's machine can enforce different rules.
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
