[project]
name = "diagnose"
version = "0.0.0"
description = "Claude function-calling agent: diagnoses incidents and proposes fixes."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Bounded, not open-ended. `ruff>=0.7` meant CI installed whatever was
    # newest while a developer kept whatever they had: 0.16 promoted ISC004
    # out of preview and failed a build that was green locally on 0.15.
    # A linter that disagrees with itself across machines is worse than a
    # slightly older one.
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diagnose"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Selected explicitly rather than inherited from whatever this ruff version
# happens to default to — the same drift the version bound above addresses,
# from the other direction.
extend-select = ["ISC"]
