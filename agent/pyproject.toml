[project]
name = "diagnose"
version = "0.0.0"
description = "Claude function-calling agent: diagnoses incidents and proposes fixes."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diagnose"]

[tool.ruff]
line-length = 100
